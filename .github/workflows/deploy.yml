# Production release on every merge to main (Infra §1, §3).
# Order: database migrations first (expand), then the app. Rollback of the app:
# `npx wrangler rollback` restores the previous Worker version in under a minute.
# Needs secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID and variable SUPABASE_PROJECT_ID. Missing secrets skip that step.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      HAS_SUPABASE_SECRETS: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_DB_PASSWORD != '' && vars.SUPABASE_PROJECT_ID != '' }}
    steps:
      - name: Skip when Supabase secrets are missing
        if: env.HAS_SUPABASE_SECRETS != 'true'
        run: echo "::notice::Migrations skipped — add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD secrets and SUPABASE_PROJECT_ID variable."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_SUPABASE_SECRETS == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.HAS_SUPABASE_SECRETS == 'true'
        with:
          node-version: "24"
          cache: npm
      - if: env.HAS_SUPABASE_SECRETS == 'true'
        run: npm ci
      - name: Push migrations
        if: env.HAS_SUPABASE_SECRETS == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx supabase link --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
          npx supabase db push

  app:
    name: Deploy Worker
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip when Cloudflare secrets are missing
        if: env.HAS_CLOUDFLARE_SECRETS != 'true'
        run: echo "::notice::Deploy skipped — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        with:
          node-version: "24"
          cache: npm
      - if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        run: npm ci
      - name: Build and deploy
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: npm run deploy
