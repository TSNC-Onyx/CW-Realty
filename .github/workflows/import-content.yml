# One-time import of the current live-site listings, photos, and team members into
# the hosted database (Phase 2). Run it by hand after the Deploy workflow has applied
# the migrations and while the Wix site is still online. Safe to re-run: it only adds
# records that are missing and never changes existing ones.
# Needs repository secret SUPABASE_SERVICE_ROLE_KEY and variable NEXT_PUBLIC_SUPABASE_URL.
name: Import live-site content

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-content
  cancel-in-progress: false

jobs:
  import:
    name: Import listings, photos, and team
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Import content
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run content:import
