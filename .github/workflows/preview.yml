# Preview URL for every pull request (Infra §1). Uploads a version of the preview Worker
# (cw-realty-preview, see wrangler.jsonc env.preview) with a per-PR alias; production is
# never touched. The preview Worker must exist first: preview-build1.yml creates it.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Until they are added, this job skips with a notice instead of failing.
name: Preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Upload preview version
    # Pull requests from forks never receive secrets; only preview same-repo branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      PREVIEW_ALIAS: pr-${{ github.event.number }}
    steps:
      - name: Skip when Cloudflare secrets are missing
        if: env.HAS_CLOUDFLARE_SECRETS != 'true'
        run: echo "::notice::Preview skipped — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable preview URLs."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        with:
          node-version: "24"
          cache: npm
      - if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        run: npm ci
      - name: Build and upload preview version
        id: upload
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare upload --env preview --preview-alias "$PREVIEW_ALIAS" | tee upload.log
          url=$(grep -oE 'https://[^ ]*workers\.dev' upload.log | grep "$PREVIEW_ALIAS" | head -n1)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: env.HAS_CLOUDFLARE_SECRETS == 'true' && steps.upload.outputs.url != ''
        with:
          header: preview
          message: |
            **Preview:** ${{ steps.upload.outputs.url }}
            Commit ${{ github.event.pull_request.head.sha }}
