# Weekly dependency updates; security fixes open immediately (Infra §2: patch critical within 7 days).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: build1
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: build1
    schedule:
      interval: weekly
