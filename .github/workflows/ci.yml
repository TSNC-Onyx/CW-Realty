# Required checks for every pull request (Infra §1, §2, §5, §6).
name: CI

on:
  pull_request:
  push:
    branches: [build1, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  # Supabase config reads this for the local sign-in bot check; Cloudflare's public test secret.
  SUPABASE_AUTH_CAPTCHA_SECRET: "1x0000000000000000000000000000000AA"
  LHCI_VERSION: "0.15.1"

jobs:
  quality:
    name: Lint, types, unit tests, dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Design token check (Style §11.15)
        run: npm run design:check
      - run: npm run typecheck
      - run: npm test
      - name: Dependency scan (fails on critical vulnerabilities)
        run: npm audit --audit-level=critical

  database:
    name: Migrations, RLS tests, migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Migration safety check
        run: npm run db:check
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      - name: Start database and apply migrations
        run: npx supabase db start
      - name: Lint database functions
        run: npx supabase db lint --local --schema cwr --level warning --fail-on warning
      - name: RLS and workflow tests (pgTAP)
        run: npx supabase test db

  browser:
    name: Build, browser tests, accessibility, performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Cloudflare's public always-pass Turnstile test keys (not secrets).
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # A throwaway local database with small test content, so the listing, team, and
      # admin tests run on every pull request (the keys below are local-only defaults).
      - name: Start local database
        run: npm run db:start
      - name: Export local database settings
        run: |
          npx supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.publishable_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            | sed 's/"//g' >> "$GITHUB_ENV"
      - name: Import test content
        run: npm run content:import
        env:
          CONTENT_FILE: tests/fixtures/test-content.json
          SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: npm run test:e2e
      - name: Lighthouse performance budgets
        run: npx --yes @lhci/cli@${{ env.LHCI_VERSION }} autorun
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-reports
          path: |
            playwright-report
            .lighthouseci
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          extra_args: --results=verified,unknown
